<!doctype html>
<html lang="th" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>แอดมิน</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght=300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  
  <script>
    document.addEventListener('contextmenu', event => event.preventDefault());
    document.addEventListener('keydown', function(e) {
      if(e.keyCode == 123) { e.preventDefault(); return false; } 
      if(e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) { e.preventDefault(); return false; } 
      if(e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) { e.preventDefault(); return false; } 
      if(e.ctrlKey && e.shiftKey && e.keyCode == 'C'.charCodeAt(0)) { e.preventDefault(); return false; } 
      if(e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) { e.preventDefault(); return false; } 
    });
  </script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: 'var(--color-primary)',
            secondary: 'var(--color-secondary)',
          }
        }
      }
    }
  </script>

  <!-- สคริปต์ดึงคอนฟิกแคชก่อนเรนเดอร์ เพื่อจัดเตรียมธีมและป้องกันปัญหาการกระพริบของหน้าจอ -->
  <script>
    (function() {
      var cached = localStorage.getItem('tos_cached_config');
      var p = '#2563eb';
      var s = '#4f46e5';
      var type = 'gradient';
      if (cached) {
        try {
          var cfg = JSON.parse(cached);
          p = cfg.themePrimary || p;
          s = cfg.themeSecondary || s;
          type = cfg.themeType || type;
          if (cfg.tabTitle) {
            document.title = cfg.tabTitle + " - แอดมิน";
          }
        } catch (e) {}
      }
      document.documentElement.style.setProperty('--color-primary', p);
      document.documentElement.style.setProperty('--color-secondary', s);

      var styleEl = document.createElement('style');
      styleEl.id = 'dynamic-theme-style';
      var bgStyle = (type === 'single') 
        ? "background: " + p + " !important;" 
        : "background: linear-gradient(135deg, " + p + ", " + s + ") !important;";

      styleEl.innerHTML = [
        ":root {",
        "  --color-primary: " + p + ";",
        "  --color-secondary: " + s + ";",
        "}",
        ".text-sky-400 { color: " + s + " !important; }",
        ".bg-sky-600 { background-color: " + s + " !important; }",
        ".bg-sky-500 { background-color: " + s + " !important; }",
        ".border-sky-500 { border-color: " + s + " !important; }",
        ".border-sky-500\\/30 { border-color: " + s + "4d !important; }",
        ".text-sky-500 { color: " + s + " !important; }",
        ".bg-sky-500\\/10 { background-color: " + s + "1a !important; }",
        ".text-primary { color: " + p + " !important; }",
        ".bg-primary { background-color: " + p + " !important; }",
        ".border-primary { border-color: " + p + " !important; }",
        ".bg-theme-gradient { " + bgStyle + " }"
      ].join("\n");
      document.head.appendChild(styleEl);
    })();
  </script>

  <style>
    * { 
      font-family: 'Kanit', sans-serif; 
      -webkit-font-smoothing: antialiased; 
      box-sizing: border-box;
      font-weight: 300;
    }
    b, strong, h1, h2, h3, h4, th, .font-bold, .font-black, .font-semibold {
      font-weight: 400 !important;
    }
    html, body { 
      min-height: 100%; 
      margin: 0; 
      background-color: #0f172a; 
      color: #e2e8f0;
    }
    .scrollbar-none::-webkit-scrollbar {
      display: none;
    }
    .scrollbar-none {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .custom-shadow {
      box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.3);
    }
    .industrial-border {
      border: 1px solid rgba(51, 65, 85, 0.5);
    }
    .led-glow-green {
      box-shadow: 0 0 8px #10b981;
    }
    .led-glow-amber {
      box-shadow: 0 0 8px #f59e0b;
    }
  </style>
 </head>
 <body class="h-full antialiased selection:bg-sky-900 selection:text-sky-100">
  
  <div id="app" class="h-full w-full overflow-hidden relative flex"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { 
      getFirestore, doc, setDoc, deleteDoc, collection, onSnapshot, query, where, getDocs, runTransaction 
    } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
    import { 
      getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

    const _obfuscatedConfig = "eyJhcGlLZXkiOiJBSXphU3lEOHpQVjZfdmpTS3FMN083VC1DLTA0Yk50NzFRRmtuQmciLCJhdXRoRG9tYWluIjoia2stODg4LWVlMjI0LmZpcmViYXNlYXBwLmNvbSIsInByb2plY3RJZCI6ImtrLTg4OC1lZTIyNCIsInN0b3JhZ2VCdWNrIjoia2stODg4LWVlMjI0LmZpcmViYXNlc3RvcmFnZS5hcHAiLCJtZXNzYWdpbmdTZW5kZXJJZCI6IjEzNTcxMTMzODUxNCIsImFwcElkIjoiMToxMzU3MTEzMzg1MTQ6d2ViOjZjZDhlZmUyZDE0Y2IxMjlhYmE4Y2IiLCJtZWFzdXJlbWVudElkIjoiRy1TUzVXMTZOUllTIn0=";
    const firebaseConfig = JSON.parse(atob(_obfuscatedConfig));

    const appInstance = initializeApp(firebaseConfig);
    const db = getFirestore(appInstance);
    const auth = getAuth(appInstance);

    // ==========================================
    // STATE ENGINE
    // ==========================================
    let isAdmin = false;
    let adminTab = 'users';
    let adminUserSearch = ""; 
    let adminWithdrawalSearch = "";
    let adminOrderSearch = "";
    let adminProductTab = '1'; 
    let adminProductPage = 1;
    const ITEMS_PER_PAGE = 10;

    let publicData = {
      configs: [],
      banners: [],
      galleries: [],
      menuIcons: [],
      products: []
    };

    let adminUsersData = [];
    let rawUsersEng = [];
    let adminWithdrawalsData = [];
    let adminSpecialAssignData = [];
    let adminSpecialTemplatesData = [];
    let adminShowcaseData = [];
    let allUserOrdersData = [];

    let activeListeners = {
      configs: null, banners: null, galleries: null, menuIcons: null, products: null,
      adminUsers: null, adminWithdrawals: null, adminSpecialAssigns: null, adminSpecialTemplates: null, showcaseProducts: null, allOrders: null
    };

    const $ = id => document.getElementById(id);
    const getUsers = () => adminUsersData;
    const getProducts = () => publicData.products;
    const getSpecialTemplates = () => adminSpecialTemplatesData;
    const getSpecialAssignments = () => adminSpecialAssignData;
    const getWithdrawals = () => adminWithdrawalsData;
    const getBanners = () => publicData.banners;
    const getGallery = () => publicData.galleries;
    const getMenuIcons = () => publicData.menuIcons;
    const getShowcaseProducts = () => adminShowcaseData;

    const getConfig = () => {
      if (publicData.configs && publicData.configs.length > 0) {
        return publicData.configs[0];
      }
      const cached = localStorage.getItem('tos_cached_config');
      if (cached) {
        try {
          return JSON.parse(cached);
        } catch (e) {}
      }
      return {
        themePrimary: '',
        themeSecondary: '',
        themeType: 'gradient',
        themeMarqueeBg: '#eb2f96',
        themeMenuBg: '#eb2f96',
        inviteCode: '',
        logoUrl: '',
        loginBgUrl: '',
        userBgUrl: '',
        marqueeText: '',
        tabTitle: '',
        tabFaviconUrl: '',
        scheduleText: 'เปิดทำการ 10:00-22:00 น.',
        rewardsList: '095***567:433,000,095***091:2,050,000,088***324:120,500',
        supportedBanks: 'KBank,SCB,BBL,KTB,Krungsri,GSB,TrueMoney'
      };
    };

    const getInviteCode = () => { const c = getConfig(); return String(c.inviteCode || '').trim(); };
    const getLogoUrl = () => { const c = getConfig(); return c.logoUrl || ''; };
    const getMarqueeText = () => { const c = getConfig(); return c.marqueeText || ''; };
    const getLineQrUrl = () => { const c = getConfig(); return c.lineQrUrl || ''; };
    const getLineId = () => { const c = getConfig(); return c.lineId || ''; };
    const getTopupQrUrl = () => { const c = getConfig(); return c.topupQrUrl || ''; };
    const getTopupAccount = () => { const c = getConfig(); return c.topupAccount || ''; };
    const getTabTitle = () => { const c = getConfig(); return c.tabTitle || ''; };
    const getTabFavicon = () => { const c = getConfig(); return c.tabFaviconUrl || ''; };

    function genId() {
      if (typeof crypto !== 'undefined' && typeof crypto.randomUUID === 'function') {
        return crypto.randomUUID();
      }
      return Date.now().toString(36) + Math.random().toString(36).slice(2,8);
    }

    function showToast(msg, type='success') {
      const Toast = Swal.mixin({
        toast: true,
        position: 'top-end',
        showConfirmButton: false,
        timer: 3000,
        timerProgressBar: true,
        background: '#1e293b',
        color: '#f8fafc',
        iconColor: type === 'success' ? '#10b981' : (type === 'error' ? '#ef4444' : '#0284c7'),
        didOpen: (toast) => {
          toast.addEventListener('mouseenter', Swal.stopTimer)
          toast.addEventListener('mouseleave', Swal.resumeTimer)
        }
      });

      Toast.fire({
        icon: type === 'success' ? 'success' : (type === 'error' ? 'error' : 'info'),
        title: msg
      });
    }

    function showModal(content) {
      let m = $('modal-overlay');
      if (!m) { 
        m = document.createElement('div'); m.id = 'modal-overlay'; 
        m.addEventListener('click', function(e) { if (e.target === m) closeModal(); });
        document.body.appendChild(m); 
      }
      m.className = 'fixed inset-0 bg-slate-950/70 z-[100] flex items-center justify-center p-4 cursor-pointer backdrop-blur-md';
      m.innerHTML = `
        <div class="bg-slate-900 text-slate-100 rounded-2xl p-6 w-full max-w-md modal-anim shadow-2xl border border-slate-700 max-h-[90vh] overflow-y-auto cursor-auto" onclick="event.stopPropagation()">
          ${content}
        </div>`;
      lucide.createIcons();
    }
    function closeModal() { const m = $('modal-overlay'); if (m) m.remove(); }

    function applyTheme(primary, secondary, themeType) {
      const p = primary || '#2563eb';
      const s = secondary || '#4f46e5';
      const type = themeType || 'gradient';
      
      document.documentElement.style.setProperty('--color-primary', p);
      document.documentElement.style.setProperty('--color-secondary', s);

      let styleEl = document.getElementById('dynamic-theme-style');
      if (!styleEl) {
        styleEl = document.createElement('style');
        styleEl.id = 'dynamic-theme-style';
        document.head.appendChild(styleEl);
      }
      
      const bgStyle = (type === 'single') 
        ? `background: ${p} !important;` 
        : `background: linear-gradient(135deg, ${p}, ${s}) !important;`;

      styleEl.innerHTML = `
        :root {
          --color-primary: ${p};
          --color-secondary: ${s};
        }
        .text-sky-400 { color: ${s} !important; }
        .bg-sky-600 { background-color: ${s} !important; }
        .bg-sky-500 { background-color: ${s} !important; }
        .border-sky-500 { border-color: ${s} !important; }
        .border-sky-500\\/30 { border-color: ${s}4d !important; }
        .text-sky-500 { color: ${s} !important; }
        .bg-sky-500\\/10 { background-color: ${s}1a !important; }
        .text-primary { color: ${p} !important; }
        .bg-primary { background-color: ${p} !important; }
        .border-primary { border-color: ${p} !important; }
        .bg-theme-gradient { 
          ${bgStyle}
        }
      `;
    }

    const getCol = (type) => {
      const map = { 
        user: 'users', 
        order: 'orders', 
        product: 'products', 
        withdrawal: 'withdrawals', 
        config: 'configs', 
        banner: 'banners', 
        gallery: 'galleries', 
        menuIcon: 'menu_icons', 
        special_template: 'special_templates', 
        special_assignments: 'special_assignments',
        showcase_product: 'showcase_products'
      };
      return map[type] || 'misc';
    };

    const windowDataSdk = {
      create: async function(obj) {
        if(!obj.id) obj.id = genId();
        obj.__backendId = obj.id;
        const col = getCol(obj.type);
        await setDoc(doc(db, col, obj.id), obj);
        return {isOk: true};
      },
      update: async function(obj) {
        const backendId = obj.__backendId || obj.id;
        const col = getCol(obj.type);
        await setDoc(doc(db, col, backendId), obj);
        return {isOk: true};
      },
      delete: async function(obj) {
        const col = getCol(obj.type);
        await deleteDoc(doc(db, col, obj.__backendId || obj.id));
        return {isOk: true};
      }
    };

    function updateHeaderStats() {
      const elMembers = $('stat-total-members');
      const elOrders = $('stat-total-orders');
      const elProducts = $('stat-total-products');
      
      if (elMembers) elMembers.innerText = `${adminUsersData.length} บัญชี`;
      if (elOrders) elOrders.innerText = `${allUserOrdersData.length} รายการ`;
      if (elProducts) elProducts.innerText = `${publicData.products.length} ชิ้น`;
    }

    function renderPagination(totalItems, currentPage, callbackName) {
      const totalPages = Math.ceil(totalItems / ITEMS_PER_PAGE) || 1;
      if (totalPages <= 1) return '';

      let html = `<div class="flex items-center justify-center gap-2 mt-6 font-mono text-xs">`;
      for (let i = 1; i <= totalPages; i++) {
        const activeClass = i === currentPage ? 'bg-sky-500 text-slate-950 font-medium text-xs' : 'bg-slate-800 text-slate-400 hover:bg-slate-700 text-xs';
        html += `<button onclick="${callbackName}(${i})" class="px-2.5 py-1.5 rounded transition ${activeClass}">${i}</button>`;
      }
      html += `</div>`;
      return html;
    }

    async function saveConfigToFirebase(payload) {
      const docId = "system_config";
      payload.id = docId;
      payload.__backendId = docId;
      const cleanData = { ...payload };
      delete cleanData.__collection; 
      await setDoc(doc(db, "configs", docId), cleanData);
    }

    let adminRenderTimeout = null;
    function debouncedRenderAdminTab() {
      if (adminRenderTimeout) clearTimeout(adminRenderTimeout);
      adminRenderTimeout = setTimeout(() => {
        if ($('admin-content')) {
          renderAdminTab();
        }
      }, 100);
    }

    function startPublicSubscriptions() {
      activeListeners.configs = onSnapshot(doc(db, "configs", "system_config"), (docSnap) => {
        if (docSnap.exists()) {
          const cfgData = { ...docSnap.data(), __backendId: docSnap.id };
          publicData.configs = [cfgData];
          localStorage.setItem('tos_cached_config', JSON.stringify(cfgData));
          applyTheme(cfgData.themePrimary, cfgData.themeSecondary, cfgData.themeType);
          
          const targetTitle = (cfgData.tabTitle || '') + " - แอดมิน";
          if (document.title !== targetTitle) {
            document.title = targetTitle;
          }
        }
        updateHeaderStats();
      }, (err) => {
        console.warn("ข้อกำหนดระบบโหลดผิดพลาด: ", err);
      });

      activeListeners.banners = onSnapshot(collection(db, "banners"), (snapshot) => {
        let banners = [];
        snapshot.forEach(d => banners.push({ ...d.data(), __backendId: d.id }));
        publicData.banners = banners;
        debouncedRenderAdminTab();
      }, (err) => console.warn(err));

      activeListeners.galleries = onSnapshot(collection(db, "galleries"), (snapshot) => {
        let galleries = [];
        snapshot.forEach(d => galleries.push({ ...d.data(), __backendId: d.id }));
        publicData.galleries = galleries;
        debouncedRenderAdminTab();
      }, (err) => console.warn(err));

      activeListeners.menuIcons = onSnapshot(collection(db, "menu_icons"), (snapshot) => {
        let icons = [];
        snapshot.forEach(d => icons.push({ ...d.data(), __backendId: d.id }));
        publicData.menuIcons = icons.sort((a,b) => parseInt(a.menuOrder||0) - parseInt(b.menuOrder||0));
        debouncedRenderAdminTab();
      }, (err) => console.warn(err));

      activeListeners.products = onSnapshot(collection(db, "products"), (snapshot) => {
        let prods = [];
        snapshot.forEach(d => prods.push({ ...d.data(), __backendId: d.id }));
        publicData.products = prods.sort((a,b) => parseInt(a.productOrder||0) - parseInt(b.productOrder||0));
        updateHeaderStats();
        debouncedRenderAdminTab();
      }, (err) => console.warn(err));
    }

    function startAdminSubscriptions() {
      stopAdminSubscriptions();
      
      activeListeners.adminUsers = onSnapshot(collection(db, "users"), (snapshot) => {
        rawUsersEng = [];
        snapshot.forEach(d => rawUsersEng.push({ ...d.data(), id: d.id, __backendId: d.id }));
        adminUsersData = rawUsersEng;
        updateHeaderStats();
        debouncedRenderAdminTab();
      }, (err) => console.warn(err));

      activeListeners.adminWithdrawals = onSnapshot(collection(db, "withdrawals"), (snapshot) => {
        adminWithdrawalsData = [];
        snapshot.forEach(d => adminWithdrawalsData.push({ ...d.data(), __backendId: d.id }));
        debouncedRenderAdminTab();
      }, (err) => console.warn(err));

      activeListeners.adminSpecialAssigns = onSnapshot(collection(db, "special_assignments"), (snapshot) => {
        adminSpecialAssignData = [];
        snapshot.forEach(d => adminSpecialAssignData.push({ ...d.data(), __backendId: d.id }));
        debouncedRenderAdminTab();
      }, (err) => console.warn(err));

      activeListeners.adminSpecialTemplates = onSnapshot(collection(db, "special_templates"), (snapshot) => {
        adminSpecialTemplatesData = [];
        snapshot.forEach(d => adminSpecialTemplatesData.push({ ...d.data(), __backendId: d.id }));
        debouncedRenderAdminTab();
      }, (err) => console.warn(err));

      activeListeners.showcaseProducts = onSnapshot(collection(db, "showcase_products"), (snapshot) => {
        adminShowcaseData = [];
        snapshot.forEach(d => adminShowcaseData.push({ ...d.data(), __backendId: d.id }));
        adminShowcaseData.sort((a, b) => parseInt(a.order || 0) - parseInt(b.order || 0));
        debouncedRenderAdminTab();
      }, (err) => console.warn(err));

      activeListeners.allOrders = onSnapshot(collection(db, "orders"), (snapshot) => {
        allUserOrdersData = [];
        snapshot.forEach(d => allUserOrdersData.push({ ...d.data(), __backendId: d.id }));
        updateHeaderStats();
        debouncedRenderAdminTab();
      }, (err) => console.warn(err));
    }

    function stopAdminSubscriptions() {
      if (activeListeners.adminUsers) { activeListeners.adminUsers(); activeListeners.adminUsers = null; }
      if (activeListeners.adminWithdrawals) { activeListeners.adminWithdrawals(); activeListeners.adminWithdrawals = null; }
      if (activeListeners.adminSpecialAssigns) { activeListeners.adminSpecialAssigns(); activeListeners.adminSpecialAssigns = null; }
      if (activeListeners.adminSpecialTemplates) { activeListeners.adminSpecialTemplates(); activeListeners.adminSpecialTemplates = null; }
      if (activeListeners.showcaseProducts) { activeListeners.showcaseProducts(); activeListeners.showcaseProducts = null; }
      if (activeListeners.allOrders) { activeListeners.allOrders(); activeListeners.allOrders = null; }
    }

    // ==========================================
    // ADMIN AUTH UI
    // ==========================================
    function renderAdminLogin() {
      const app = $('app');
      const logoUrl = getLogoUrl();
      const logoHtml = logoUrl ? `<img src="${logoUrl}" class="w-16 h-16 mx-auto object-cover rounded-xl border border-slate-700 shadow-sm mb-3">` : `<div class="w-16 h-16 bg-slate-800 rounded-xl mx-auto flex items-center justify-center border border-slate-700 text-sky-400 mb-3"><i data-lucide="lock" class="w-8 h-8"></i></div>`;
      app.innerHTML = `
      <div class="min-h-full w-full flex items-center justify-center p-4 bg-slate-950">
        <div class="w-full max-w-sm bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-2xl">
          <div class="text-center mb-6">
            ${logoHtml}
            <h2 class="text-sky-400 font-medium text-lg mt-4 tracking-wider">แอดมิน</h2>
            <p class="text-slate-500 text-[10px] mt-1 font-mono">SECURE INTERFACE CENTER</p>
          </div>
          <div class="space-y-4">
            <div>
              <label class="text-[11px] text-slate-400 font-medium block mb-1 uppercase">สิทธิ์อีเมลผู้ดูแลระบบ</label>
              <input id="inp-admin-email" type="email" class="w-full px-4 py-2.5 rounded bg-slate-950 text-slate-100 placeholder-slate-600 outline-none border border-slate-800 focus:border-sky-500 text-sm font-mono" placeholder="username@admin.com">
            </div>
            <div>
              <label class="text-[11px] text-slate-400 font-medium block mb-1 uppercase">รหัสผ่านประมวลผล</label>
              <input id="inp-admin-pass" type="password" onkeydown="if(event.key === 'Enter') doAdminLogin()" class="w-full px-4 py-2.5 rounded bg-slate-950 text-slate-100 placeholder-slate-600 outline-none border border-slate-800 focus:border-sky-500 text-sm" placeholder="••••••••">
            </div>
            <button onclick="doAdminLogin()" id="btn-admin-login" class="w-full py-3 bg-sky-600 hover:bg-sky-500 text-slate-950 font-medium rounded shadow transition text-xs uppercase tracking-wider">เชื่อมต่อเข้าสู่ระบบ</button>
          </div>
        </div>
      </div>`;
      lucide.createIcons();
    }

    async function doAdminLogin() {
      const email = $('inp-admin-email').value.trim();
      const password = $('inp-admin-pass').value.trim();
      if (!email || !password) return showToast('กรุณากรอกข้อมูลเพื่อระบุตัวตนให้ครบถ้วน','error');
      if (!email.endsWith('@admin.com')) return showToast('อีเมลต้องลงท้ายด้วย @admin.com เท่านั้น','error');

      const btn = $('btn-admin-login');
      btn.disabled = true; btn.textContent = 'กำลังยืนยันสิทธิ์...';

      try {
        await signInWithEmailAndPassword(auth, email, password);
        showToast('เชื่อมต่อบอร์ดควบคุมแอดมินสำเร็จ');
      } catch (err) {
        btn.disabled = false; btn.textContent = 'เชื่อมต่อเข้าสู่ระบบ';
        showToast(`สิทธิ์การเข้าใช้งานถูกปฏิเสธ: ${err.message}`,'error');
      }
    }

    async function exitAdmin() { 
      isAdmin = false; 
      stopAdminSubscriptions();
      await signOut(auth);
    }

    // ==========================================
    // ADMIN PANEL LAYOUT
    // ==========================================
    function renderAdmin() {

    async function doCreateUser() {
      const ph = $('an-phone').value.trim();
      const un = $('an-username').value.trim();
      const pw = $('an-pass').value.trim();
      const pin = $('an-pin').value.trim();

      if (!ph || !un || !pw || !pin) return showToast('กรุณากรอกข้อมูลเพื่อใช้ระบุตัวตนให้ครบถ้วน', 'error');

      const btn = $('btn-submit-user');
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> <span>กำลังบันทึก...</span>`;
        lucide.createIcons();
      }

      try {
        await windowDataSdk.create({
          type: 'user',
          id: genId(),
          username: un,
          phone: ph,
          password: pw,
          withdrawPassword: pin,
          firstName: '',
          lastName: '',
          credit: 0,
          bankName: '',
          bankNumber: '',
          userLevel: '1',
          runIndex: 0,
          creditScore: 100,
          createdAt: new Date().toISOString()
        });
        showToast('ลงทะเบียนสมาชิกใหม่สำเร็จเรียบร้อย');
        closeModal();
        debouncedRenderAdminTab();
      } catch (err) {
        showToast('เกิดข้อผิดพลาดจากเครือข่ายในการบันทึกข้อมูล', 'error');
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = `<span>บันทึกและอนุมัติ</span>`;
        }
      }
    }

    async function resetUserTasks(bid) {
      const u = adminUsersData.find(d => d.__backendId === bid);
      if(!u) return;

      const result = await Swal.fire({
        title: 'ยืนยันการรีเซ็ตภารกิจ?',
        text: `คุณต้องการเริ่มรีเซ็ตจำนวนภารกิจของ ${u.username} เป็น 0 หรือไม่?`,
        icon: 'warning',
        showCancelButton: true,
        confirmButtonText: 'ใช่, รีเซ็ตเลย',
        cancelButtonText: 'ยกเลิก',
        background: '#1e293b',
        color: '#f8fafc',
        confirmButtonColor: '#d97706',
        cancelButtonColor: '#64748b'
      });

      if (result.isConfirmed) {

    function promptUserBalanceUpdate(bid, adjustType) {
      const actionText = adjustType === 'deposit' ? 'เพิ่มเครดิต' : 'ลดเครดิต';
      Swal.fire({
        title: `${actionText}`,
        text: 'กรุณากรอกจำนวนเงิน:',
        input: 'number',
        inputAttributes: {
          min: 1,
          step: 1
        },
        showCancelButton: true,
        confirmButtonText: 'ตกลง',
        cancelButtonText: 'ยกเลิก',
        background: '#1e293b',
        color: '#f8fafc',
        confirmButtonColor: '#0284c7',
        cancelButtonColor: '#64748b'
      }).then((result) => {
        if (result.isConfirmed) {
          const amount = parseFloat(result.value);
          if (isNaN(amount) || amount <= 0) {
            showToast('กรุณากรอกจำนวนเงินที่ถูกต้อง', 'error');
            return;
          }
          const adjustAmount = adjustType === 'deposit' ? amount : -amount;
          adjustUserBalanceDirectly(bid, adjustAmount);
        }
      });
    }

    async function adjustUserBalanceDirectly(bid, adjustAmount) {
      const u = adminUsersData.find(d => d.__backendId === bid);
      let userDocRef = doc(db, "users", u.id);
      let wdCol = collection(db, "withdrawals");
      try {
        await runTransaction(db, async (transaction) => {
          const snap = await transaction.get(userDocRef);
          if (!snap.exists()) return;
          const currentCredit = snap.data().credit || 0;

          const updatePayload = {
            credit: Math.max(0, currentCredit + adjustAmount)
          };

          transaction.update(userDocRef, updatePayload);

          const newWdRef = doc(wdCol);
          transaction.set(newWdRef, {
            type: 'withdrawal',
            id: newWdRef.id,
            userId: u.id,
            username: snap.data().username || 'User',
            amount: Math.abs(adjustAmount),
            status: adjustAmount > 0 ? 'deposit' : 'rejected',
            createdAt: new Date().toISOString()
          });
        });
        showToast('แก้ไขข้อมูลการปรับปรุงเครดิตบัญชีเรียบร้อย');
        closeModal();
        debouncedRenderAdminTab();
      } catch (err) {
        showToast('ล้มเหลวในการปรับปรุงเครดิตสมาชิก', 'error');
      }
    }

    async function approveWithdraw(bid) { 
      const w = adminWithdrawalsData.find(d => d.__backendId === bid); 
      if(!w) return;
      w.status = 'approved'; 
      await windowDataSdk.update(w); 
      showToast('อนุมัติบิลถอนเงินสำเร็จ');
      debouncedRenderAdminTab(); 
    }
    
    async function rejectWithdraw(bid) { 
      const w = adminWithdrawalsData.find(d => d.__backendId === bid); 
      if(!w) return;
      let userDocRef = doc(db, "users", w.userId);
      const wdDocRef = doc(db, "withdrawals", bid);

      try {
        await runTransaction(db, async (transaction) => {
          const uSnap = await transaction.get(userDocRef);
          if (uSnap.exists()) {
            const currentCredit = uSnap.data().credit || 0;
            const refundedVal = currentCredit + (w.amount || 0);
            transaction.update(userDocRef, { credit: refundedVal });
          }
          transaction.update(wdDocRef, { status: 'rejected' });
        });
        showToast('ปฏิเสธการถอนเงินเรียบร้อย ยอดเครดิตคืนเข้าพอร์ตสมาชิกแล้ว');
        debouncedRenderAdminTab();
      } catch (err) {
        showToast('การส่งผ่านข้อมูลธุรกรรมล้มเหลว', 'error');
      }
    }

    async function approveDeposit(bid) {
      const w = adminWithdrawalsData.find(d => d.__backendId === bid);
      if(!w) return;
      let userDocRef = doc(db, "users", w.userId);
      const wdDocRef = doc(db, "withdrawals", bid);

      try {
        await runTransaction(db, async (transaction) => {
          const uSnap = await transaction.get(userDocRef);
          if (uSnap.exists()) {
            const currentCredit = uSnap.data().credit || 0;
            const addedVal = currentCredit + (w.amount || 0);
            transaction.update(userDocRef, { credit: addedVal });
          }
          transaction.update(wdDocRef, { status: 'deposit' });
        });
        showToast('อนุมัติยอดฝากและเติมเงินเข้าพอร์ตผู้ใช้สำเร็จ!');
        debouncedRenderAdminTab();
      } catch (err) {
        showToast('เกิดข้อผิดพลาดในการประมวลผลธุรกรรม: ' + err.message, 'error');
      }
    }

    async function rejectDeposit(bid) {
      const w = adminWithdrawalsData.find(d => d.__backendId === bid);

    function renderAdminOrders(c) {

        const uPhoneNoZero = uPhone.startsWith('0') ? uPhone.substring(1) : uPhone;

    async function doEditShowcaseProduct(bid) {
      const sp = adminShowcaseData.find(d => d.__backendId === bid);
      if(!sp) return;

      await windowDataSdk.update({
        ...sp,
        order: parseInt($('esp-order').value) || 1,
        productName: $('esp-name').value.trim(),
        price: $('esp-price').value.trim(),
        image: $('esp-image').value.trim()
      });

      showToast('ปรับปรุงข้อมูลสินค้าแนะนำหน้าหลักสำเร็จ');
      closeModal();
      debouncedRenderAdminTab();
    }

    async function deleteShowcaseProduct(bid) {
      const result = await Swal.fire({
        title: 'คุณต้องการลบรายการสินค้านี้จากหน้าหลัก?',
        text: 'รูปโชว์สินค้าแนะนำดังกล่าวจะถูกยกเลิกการแสดงผลหน้าบ้านของผู้ใช้งานทันที',
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#ef4444',
        cancelButtonColor: '#64748b',
        confirmButtonText: 'ลบ',
        cancelButtonText: 'ยกเลิก',
        background: '#1e293b',
        color: '#f8fafc'
      });

      if (result.isConfirmed) {
        await windowDataSdk.delete(adminShowcaseData.find(d => d.__backendId === bid));
        showToast('ลบรายการสินค้าแนะนำเรียบร้อย');
        debouncedRenderAdminTab();
      }
    }

      const icon = btn ? btn.querySelector('i') : null;
      if (el.classList.contains('hidden')) {
        el.classList.remove('hidden');
        if (icon) {
          icon.style.transform = 'rotate(90deg)';
        }
      } else {
        el.classList.add('hidden');
        if (icon) {
          icon.style.transform = 'rotate(0deg)';
        }
      }
    };

            <div id="sec-credentials" class="hidden p-5 border-t border-slate-800 space-y-4">
              <div>
                <label class="text-[10px] text-slate-400 block mb-1">ลิงก์ URL อัปโหลดรูปโลโก้ประจำเว็บแอปพลิเคชัน</label>
                <input id="cfg-logo" class="w-full px-4 py-2.5 bg-slate-950 border border-slate-800 rounded text-slate-200 text-xs text-center" value="${logoUrl}">
              </div>
              <div>
                <label class="text-[10px] text-slate-400 block mb-1 uppercase">รหัสเชิญสมัครเข้าระบบระบบความปลอดภัย</label>
                <input id="cfg-invite" class="w-full px-4 py-2.5 bg-slate-950 border border-slate-800 rounded text-slate-200 text-xs text-center font-medium tracking-widest" value="${inviteCode}">
              </div>
              <button onclick="saveAdminSettings('logo_invite')" class="w-full py-2.5 bg-sky-600 hover:bg-sky-500 text-slate-950 font-medium text-xs rounded transition uppercase tracking-wider">บันทึกข้อมูลรหัสเชิญและโลโก้หลัก</button>
            </div>
          </div>

        </div>`;
      lucide.createIcons();
    }

    async function saveAdminTheme() {
      const p = ($('cfg-theme-p-text') ? $('cfg-theme-p-text').value.trim() : '') || ($('cfg-theme-p-picker') ? $('cfg-theme-p-picker').value : '#2563eb');
      const s = ($('cfg-theme-s-text') ? $('cfg-theme-s-text').value.trim() : '') || ($('cfg-theme-s-picker') ? $('cfg-theme-s-picker').value : '#4f46e5');
      const t = $('cfg-theme-type').value;

      const mBg = $('cfg-theme-marquee-text').value.trim();
      const uMenuBg = $('cfg-theme-menu-text').value.trim();

      let config = getConfig() || {};
      
      const updatePayload = {
        ...config,
        themePrimary: p,
        themeSecondary: s,
        themeType: t,
        themeMarqueeBg: mBg,
        themeMenuBg: uMenuBg
      };
      
      publicData.configs = [updatePayload];
      localStorage.setItem('tos_cached_config', JSON.stringify(updatePayload));
      applyTheme(p, s, t);
      await saveConfigToFirebase(updatePayload); 
      showToast('ปรับปรุงเฉดสีแอปและซิงค์ผู้ใช้เรียบร้อยแล้ว', 'success');
      debouncedRenderAdminTab();
    }

    async function saveAdminSettings(type) {
      let config = getConfig() || {};
      const updatePayload = { 
        ...config,
        type: 'config',
        id: 'system_config'
      };

      if (type === 'logo_invite') {
        updatePayload.logoUrl = $('cfg-logo').value.trim();
        updatePayload.inviteCode = $('cfg-invite').value.trim();
      }
      else if (type === 'bgs') { 
        updatePayload.loginBgUrl = $('cfg-login-bg').value.trim(); 
        updatePayload.userBgUrl = $('cfg-user-bg').value.trim(); 
      }
      else if (type === 'marquee') {
        updatePayload.marqueeText = $('cfg-marquee').value.trim();
        updatePayload.scheduleText = $('cfg-schedule').value.trim();
      }
      else if (type === 'line') { 
        updatePayload.lineQrUrl = $('cfg-line-qr').value.trim(); 
        updatePayload.lineId = $('cfg-line-id').value.trim(); 
      }
      else if (type === 'topup_banks') { 
        updatePayload.topupQrUrl = $('cfg-topup-qr').value.trim(); 
        updatePayload.topupAccount = $('cfg-topup-acc').value.trim(); 
        updatePayload.supportedBanks = $('cfg-banks').value.trim();
        updatePayload.rewardsList = $('cfg-rewards-list').value.trim();
      }
      else if (type === 'tab_config') { 
        updatePayload.tabTitle = $('cfg-tab-title').value.trim(); 
        updatePayload.tabFaviconUrl = $('cfg-tab-favicon').value.trim(); 
      }

      publicData.configs = [updatePayload];
      localStorage.setItem('tos_cached_config', JSON.stringify(updatePayload));
      await saveConfigToFirebase(updatePayload); 
      showToast('บันทึกปรับปรุงแก้ไขการตั้งค่าสำเร็จ', 'success'); 
      debouncedRenderAdminTab();
    }

    function showAddMenuIcon() { showModal(`<h3 class="font-medium text-xs mb-4 text-sky-400 border-b border-slate-800 pb-2 font-mono uppercase tracking-wider">ลงทะเบียนเพิ่มคู่มือผู้ใช้</h3><input id="mi-label" class="w-full px-4 py-2.5 bg-slate-950 border border-slate-800 text-slate-200 rounded mb-3 text-xs font-mono" placeholder="ระบุหัวข้อหัวข้อย่อยคู่มือ"><input id="mi-url" class="w-full px-4 py-2.5 bg-slate-950 border border-slate-200 text-slate-200 rounded mb-3 text-xs font-mono" placeholder="ที่อยู่ไฟล์รูปภาพไอคอน URL (ถ้ามี)"><textarea id="mi-content" class="w-full px-4 py-2.5 bg-slate-950 border border-slate-200 text-slate-200 rounded h-28 mb-4 text-xs font-mono" placeholder="รายละเอียดเนื้อความคำแนะนำแนะนำ..."></textarea><button onclick="doAddMenuIcon()" class="w-full py-2.5 bg-sky-600 hover:bg-sky-500 text-slate-950 font-medium rounded transition text-xs uppercase tracking-wider font-mono">ส่งพอร์ตบันทึกข้อมูล</button>`); }
    function editMenuIcon(bid) { const m = publicData.menuIcons.find(d => d.__backendId === bid); showModal(`<h3 class="font-medium text-xs mb-4 text-sky-400 border-b border-slate-800 pb-2 font-mono uppercase tracking-wider">แก้ไขรายละเอียดหัวข้อแนะนำระบบ</h3><input id="mi-label" class="w-full px-4 py-2.5 bg-slate-950 border border-slate-800 text-slate-200 rounded mb-3 text-xs font-medium font-mono" value="${m.menuLabel}"><input id="mi-url" class="w-full px-4 py-2.5 bg-slate-950 border border-slate-200 text-slate-200 rounded mb-3 text-xs font-mono" value="${m.menuIconUrl||''}"><textarea id="mi-content" class="w-full px-4 py-2.5 bg-slate-950 border border-slate-200 text-slate-200 rounded h-28 mb-4 text-xs font-mono">${m.menuContent||''}</textarea><button onclick="doEditMenuIcon('${bid}')" class="w-full py-2.5 bg-sky-600 hover:bg-sky-500 text-slate-950 font-medium rounded transition text-xs uppercase tracking-wider font-mono">อัปเดตและบันทึกข้อมูล</button>`); }
    function doAddMenuIcon() { windowDataSdk.create({ type:'menuIcon', id:genId(), menuLabel: $('mi-label').value.trim(), menuContent: $('mi-content').value.trim(), menuIconUrl: $('mi-url').value.trim() }); closeModal(); debouncedRenderAdminTab(); }
    function doEditMenuIcon(bid) { const m = publicData.menuIcons.find(d => d.__backendId === bid); windowDataSdk.update({ ...m, menuLabel: $('mi-label').value.trim(), menuContent: $('mi-content').value.trim(), menuIconUrl: $('mi-url').value.trim() }); closeModal(); debouncedRenderAdminTab(); }
    async function deleteMenuIcon(bid) { 
      const result = await Swal.fire({
        title: 'ยืนยันการลบคู่มือแนะนำนี้?',
        text: 'ไอเทมนี้จะถูกถอนออกจากกล่องคู่มือ 4 ไอคอนส่วนหน้าหลักผู้ใช้งาน',
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#ef4444',
        cancelButtonColor: '#64748b',
        confirmButtonText: 'ลบออก',
        cancelButtonText: 'ยกเลิก',
        background: '#1e293b',
        color: '#f8fafc'
      });

      if (result.isConfirmed) {
        await windowDataSdk.delete(publicData.menuIcons.find(d => d.__backendId === bid)); 
        debouncedRenderAdminTab(); 
      }
    }

    let userSearchTimeout = null;
    function handleAdminUserSearch(value) { 
      adminUserSearch = value; 
      if (userSearchTimeout) clearTimeout(userSearchTimeout);
      userSearchTimeout = setTimeout(() => {
        debouncedRenderAdminTab(); 
      }, 250);
    }

    let wdSearchTimeout = null;
    function handleAdminWdSearch(value) {
      adminWithdrawalSearch = value;
      if (wdSearchTimeout) clearTimeout(wdSearchTimeout);
      wdSearchTimeout = setTimeout(() => {
        debouncedRenderAdminTab();
      }, 250);
    }

    let orderSearchTimeout = null;
    function handleAdminOrderSearch(value) {
      adminOrderSearch = value;
      if (orderSearchTimeout) clearTimeout(orderSearchTimeout);
      orderSearchTimeout = setTimeout(() => {
        debouncedRenderAdminTab();
      }, 250);
    }

    onAuthStateChanged(auth, (user) => {
      if (user && user.email.endsWith('@admin.com')) {
        isAdmin = true;
        adminTab = sessionStorage.getItem('tos_admin_tab') || 'users'; 
        startAdminSubscriptions();
        renderAdmin();
      } else {
        isAdmin = false;
        renderAdminLogin();
      }
    });

    startPublicSubscriptions();

    // ==========================================
    // WINDOW GLOBAL EXPORTS
    // ==========================================
    window.doAdminLogin = doAdminLogin;
    window.exitAdmin = exitAdmin;
    window.handleSidebarClick = handleSidebarClick;
    window.changeAdminProductPage = changeAdminProductPage;
    window.changeSpecialPage = changeSpecialPage;
    window.showAddMenuIcon = showAddMenuIcon;
    window.editMenuIcon = editMenuIcon;
    window.doAddMenuIcon = doAddMenuIcon;
    window.doEditMenuIcon = doEditMenuIcon;
    window.deleteMenuIcon = deleteMenuIcon;
    window.editAdminUser = editAdminUser;

    window.deleteAssignedSpecial = deleteAssignedSpecial;

    window.rejectWithdraw = rejectWithdraw;
    window.approveDeposit = approveDeposit;

    window.showAddBanner = showAddBanner;

    window.deleteBanner = deleteBanner;

    window.doAddGallery = doAddGallery;
    window.editGallery = editGallery;
    window.doEditGallery = doEditGallery;
    window.deleteGallery = deleteGallery;
    window.saveAdminTheme = saveAdminTheme;
    window.saveAdminSettings = saveAdminSettings;
    window.closeModal = closeModal;

  </script>
